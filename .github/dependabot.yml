version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [ci]
    assignees: [JimmyMultani]

  # The base image is pinned by digest, so this also picks up rebuilds of the
  # same tag (Alpine and Python security patches). `fix:` makes each one a
  # patch release, so deployments pinned to a major version get it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The default 3-day cooldown never expires for python:3.14-alpine, which
    # is rebuilt more often than that, so base image updates would stall.
    # CI (unit tests on the image and the smoke test) still gates each one.
    cooldown:
      exclude: ["python"]
    # Move to a new Python minor version deliberately, not via a patch release.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.15"]
    commit-message:
      prefix: fix
    labels: [fix]
    assignees: [JimmyMultani]
