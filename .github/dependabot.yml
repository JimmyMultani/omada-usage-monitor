version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [ci]
    assignees: [JimmyMultani]

  # The base image is pinned by digest, so this also picks up rebuilds of the
  # same tag (Alpine and Python security patches). `fix:` makes each one a
  # patch release, so deployments pinned to a major version get it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
    labels: [fix]
    assignees: [JimmyMultani]
