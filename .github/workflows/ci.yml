name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Manual tags only; tags created by release-please use GITHUB_TOKEN, which
    # doesn't trigger workflows, so those releases publish from the main run.
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jimmymultani/omada-usage-monitor

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the oldest supported (local dev); 3.13 is what the image ships.
        python: ["3.9", "3.13"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest -v test_monitor

  release:
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
      # Step env is evaluated before `if` (so `if` can read it), even when the
      # step ends up skipped; fall back to '{}' so an empty `pr` output (no
      # release PR this run) doesn't fail fromJSON.
      - name: Assign and label release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: >-
          gh pr edit "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --add-assignee "$GITHUB_REPOSITORY_OWNER"
          --add-label chore

  publish:
    needs: [test, smoke, release]
    # release is skipped on tag pushes; publish still runs for those.
    if: >-
      always() && github.event_name == 'push'
      && needs.test.result == 'success' && needs.smoke.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # On a release-please run, semver tags come from the new tag name;
          # on a manual tag push, tag_name is empty and the git ref is used.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || needs.release.outputs.release_created == 'true' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the built image against a fake Omada API; release and publish wait
  # on it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ci/smoke_test.sh
